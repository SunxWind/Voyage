{% extends 'base.html' %}

{% block title %}
    Trip deletion approval
{% endblock %}

{% block content %}
<form method="post">{% csrf_token %}
    <p>Are you sure you want to delete the trip to "{{ object.where_to }}"?</p>
    <input class="btn btn-info" type="submit" value="Delete">
    <a class="btn btn-info" href="{% url 'trips' %}">Cansel</a>
</form>
{% endblock %}
